<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRS Solar Solution - Create Quotation</title>
    <!-- Bootstrap CSS (Version 5.3.3 for consistency) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Custom CSS (for main layout like sidebar, navbar positioning) -->
    <link rel="stylesheet" href="css/styles.css">


    <!-- Inline styles for form improvements -->
    <style>
        /* Optional: Add some padding/margin around the form within the card */
        .quotation-form-card {
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
        }
        /* Style for form groups to ensure proper spacing */
        .quotation-form-group .form-group {
            margin-bottom: 1rem; /* Adjust as needed for spacing */
        }
    </style>
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Include the sidebar fragment -->
        <div th:replace="fragments/sidebar :: sidebarMenu"></div>

        <div class="d-flex flex-column w-100">
            <!-- Include the header fragment -->
            <div th:replace="fragments/header :: headerPart"></div>

            <main class="main-content-area flex-grow-1">
                <h3 class="mb-4">Create Solar Quotation</h3>

                <div class="card p-4 quotation-form-card">
                    <h5 class="card-title mb-4">Quotation Details</h5>
                    <form>
						<div class="row g-3">
						    <div class="col-md-4">
						        <label for="quationNumber" class="form-label">Quoation No:</label>
						        <input type="text" class="form-control" id="quationNumber" th:value="${qtSequenceNumber}" placeholder="Enter Quoation No" required>
						    </div>
						    <div class="col-md-4">
						        <label for="customerName" class="form-label">Customer Name:</label>
						        <input type="text" class="form-control" id="customerName" placeholder="Enter Customer Name">
						    </div>
						    <div class="col-md-4">
						        <label for="customerMobileNumber" class="form-label">Customer Number:</label>
						        <input type="text" class="form-control" id="customerMobileNumber" placeholder="Enter Customer Mobile Number">
						    </div>
						</div>
                        <div class="row g-3 mt-2"> <!-- Using Bootstrap 5 gutter classes -->
                            <div class="col-12 col-md-3">
                                <div class="row g-2">

                                    <div class="col-12 col-sm-6">
                                        <label for="noOfPanels" class="form-label">No of Panels</label>
                                        <input type="text"
                                               class="form-control"
                                               id="noOfPanels"
                                               placeholder="No. of panels"
                                               onkeyup="CalculateActualPrice()"
                                               value=""
                                               required>
                                    </div>

                                    <div class="col-12 col-sm-6">
                                        <label for="panelWatt" class="form-label">Panel Watt</label>
                                        <input type="text"
                                               class="form-control"
                                               id="panelWatt"
                                               placeholder="Enter Panel Watt"
                                               value="540"
                                               onkeyup="CalculateActualPrice()"
                                               required>
                                    </div>

                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <label for="solarType" class="form-label">Solar Type:</label>
                                <select class="form-control" id="solarType" required>
                                    <option value="Residential">Residential</option>
                                    <option value="Commercial">Commercial</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-3">
                                <label for="panelsName" class="form-label">Panels Name:</label>
                                <input type="text" class="form-control" id="panelsName" placeholder="Enter Panels Name" value="ADANI TOPCON, ADANI BIFACIAL , WAAREE" required>
                            </div>
                            <div class="col-12 col-md-3">
                                <label for="inverter" class="form-label">Inverter:</label>
                                <input type="text" class="form-control" id="inverter" placeholder="Enter Inverter Name" value="Ksolare / Solar Yaan (10 year warranty)" required>
                            </div>
                        </div>
                        <div class="row g-3 mt-2">
                            <div class="col-md-4">
                                <label for="rateKw" class="form-label">Rate/Kw (Including GST):</label>
                                <input type="number" class="form-control" id="rateKw" onkeyup="CalculateActualPrice()" placeholder="Enter Rate/Kw" required>
                            </div>
                            <div class="col-md-4">
                                <label for="value" class="form-label">Value:</label>
                                <input type="text" class="form-control" id="value" placeholder="Enter Value" onkeyup="CalculateActualPrice()" required readonly> <!-- Added readonly as this is calculated -->
                            </div>
                            <div class="col-md-4">
                                <label for="discomMeter" class="form-label">Discom Meter:</label>
                                <input type="text" class="form-control" id="discomMeter" placeholder="Enter Discom Meter" onkeyup="CalculateActualPrice()" value="0" required>
                            </div>
                        </div>
                        <div class="row g-3 mt-2">
                            <div class="col-md-3">
                                <label for="pqHsCost" class="form-label">P.Q. and H.S. cost:</label>
                                <input type="number" class="form-control" id="pqHsCost" placeholder="Enter P.Q. and H.S." onkeyup="CalculateActualPrice()" value="0" required>
                            </div>
                            <div class="col-md-3">
                                <label for="gedaRegisterCharge" class="form-label">Geda Registration charge:</label>
                                <input type="number" class="form-control" id="gedaRegisterCharge" placeholder="Enter Geda Registration charge" onkeyup="CalculateActualPrice()" value="0" required>
                            </div>
                            <div class="col-md-3">
                                <label for="actualPrice" class="form-label">Actual Price:</label>
                                <input type="text" class="form-control" id="actualPrice" placeholder="Enter Actual Price" onkeyup="CalculateActualPrice()" required readonly> <!-- Added readonly -->
                            </div>
                            <div class="col-md-3">
                                <label for="subsidy" class="form-label">Subsidy:</label>
                                <input type="number" class="form-control" id="subsidy" placeholder="Enter Subsidy" onkeyup="CalculateActualPrice()" value="78000" required>
                            </div>
                        </div>
                        <div class="row g-3 mt-2">
                            <div class="col-md-4">
                                <label for="effectivePrice" class="form-label">Effective Price:</label>
                                <input type="number" class="form-control" id="effectivePrice" placeholder="Enter Effective Price" onkeyup="CalculateActualPrice()" required readonly> <!-- Added readonly -->
                            </div>
                            <!-- For DEALER role -->
                            <div class="col-md-4" sec:authorize="hasRole('DEALER')">
                                <label for="submittedByName" class="form-label">Submitted By:</label>
                                <input type="text" class="form-control" id="submittedByName" th:value="${currentUserName}" disabled readonly required>
                            </div>
                            <div class="col-md-4" sec:authorize="hasRole('DEALER')">
                                <label for="submittedNumber" class="form-label">Submitted Number:</label>
                                <input type="text" class="form-control" id="submittedNumber" th:value="${currentUserPhone}" disabled readonly required>
                            </div>

                            <!-- For non-DEALER roles -->
                            <div class="col-md-4" sec:authorize="!hasRole('DEALER')">
                                <label for="submittedBy" class="form-label">Submitted By:</label>
                                <input type="hidden" class="form-control" id="submittedByName" placeholder="Enter Submitted By" value="Amit Vyas" required>
                                <select class="form-control" id="submittedBy" required>
                                    <option value="+91-8866389038">Amit Vyas</option>
                                    <option value="+91-8488953026">Pramod Kansara</option>
                                    <option value="other">Other</option>
                                </select>
                                <input type="text" class="form-control mt-2" id="otherSubmittedByName" placeholder="Enter Submitter's Name" style="display: none;">
                            </div>
                            <div class="col-md-4" sec:authorize="!hasRole('DEALER')">
                                <label for="submittedNumber" class="form-label">Submitted Number:</label>
                                <input type="text" class="form-control" id="submittedNumber" placeholder="Enter Submitted Number" value="+91-8866389038" required>
                            </div>
                        </div>
						<div class="row g-3 mt-2">
						                         
						      <div class="col-md-4">
						          <label for="submittedNumber" class="form-label">Created Date:</label>
						          <input type="text" class="form-control" id="createdDate" placeholder="Enter Date" value="">
						      </div>

                            <div class="col-md-4">
                                <label for="discount" class="form-label">Discount:</label>
                                <input type="text" class="form-control" id="discount" placeholder="Enter offer in number" value="">
                                <input type="hidden" class="form-control" id="discountAmount" placeholder="Enter offer in number" value="">
                            </div>
                            
                            <div class="col-md-4">
                                <label for="pdfType" class="form-label">PDF Format:</label>
                                <select class="form-control" id="pdfType" required>
                                    <option value="Standardized">Standardized (6 Pages)</option>
                                    <option value="Single Page">Two Page PDF</option>
                                </select>
                            </div>
						</div>
                        <div class="mt-4 d-flex flex-column flex-md-row gap-2">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-file-export me-2"></i>Export</button>
                            <button type="button" class="btn btn-info" data-bs-toggle="modal" data-bs-target="#additionalInfoModal"><i class="fas fa-plus-circle me-2"></i>Additional Information</button>
                        </div>
                    </form>
                </div>
            </main>

            <!-- Additional Information Modal -->
            <div class="modal fade" id="additionalInfoModal" tabindex="-1" aria-labelledby="additionalInfoModalLabel" aria-hidden="true">
              <div class="modal-dialog modal-xl">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="additionalInfoModalLabel">Additional Information</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                    <div class="form-check mb-4">
                      <input class="form-check-input" type="checkbox" id="includeAdditionalInfo" value="true">
                      <label class="form-check-label fw-bold" for="includeAdditionalInfo">
                        Add on PDF
                      </label>
                    </div>
                    
                    <h6 class="bg-warning p-2 text-dark">MATERIAL & SPECIFICATION</h6>
                    <div class="d-none d-md-flex row g-2 mb-2">
                        <div class="col-md-4 fw-bold text-center">PRODUCT</div>
                        <div class="col-md-4 fw-bold text-center">SPECIFICATION & MAKE</div>
                        <div class="col-md-4 fw-bold text-center">UOM</div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">SOLAR PANEL</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specSolarPanel" value="615 Watt WAAREE TOPCON">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomSolarPanel" value="7 NOS">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">INVERTER</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specInverter" value="SOLARYAAN">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomInverter" value="4.2 KW">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">ACDB - DCDB</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specAcdbDcdb" value="HAVELLS / SCHNEIDER /POLYCAB">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomAcdbDcdb" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">DC CABLE</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specDcCable" value="POLYCAB - 4 SQ MM">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomDcCable" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">AC CABLE</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specAcCable" value="POLYCAB - 4 SQ MM">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomAcCable" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">EARTHING & LA</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specEarthingLa" value="EARTHING JOHNSON - 4 SQ mm LA-16 SQ mm">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomEarthingLa" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">MOUNTING STRUCTURE</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specMountingStructure" value="HINDUSTAR MAKE GI PIPE">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomMountingStructure" value="60*40*2 40*40*2 MM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">J HOOK</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specJHook" value="15 mm">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomJHook" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">EARTHING</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specEarthing" value="Government Approved">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomEarthing" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">ISOLATION MCB</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specIsolationMcb" value="32 AMP 2 POLE - HAVELLS / Polycab">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomIsolationMcb" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">PVC PIPE & ELBOW</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specPvcPipe" value="POLYCAB 25 MM / MARUTI 25 MM">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomPvcPipe" value="AS PER SYSTEM">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">FASTNER</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specFastner" value="10X100">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomFastner" value="WEDGE TYPE">
                        </div>
                    </div>
                    <div class="row g-2 mb-2 border-bottom pb-2">
                        <div class="col-12 col-md-4 d-flex align-items-center"><label class="small text-muted fw-bold w-100 mb-0">OPERATION & MAINTANANCE</label></div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">Specification</label>
                            <input type="text" class="form-control form-control-sm" id="specOAndM" value="BY NRS SOLAR SOLUTION & (CLEANING HAS TO DONE BY CONSUMER)">
                        </div>
                        <div class="col-12 col-sm-6 col-md-4">
                            <label class="d-md-none small text-muted">UOM</label>
                            <input type="text" class="form-control form-control-sm" id="uomOAndM" value="5 YEARS">
                        </div>
                    </div>
                    
                    <h6 class="bg-warning p-2 text-dark">WARRANTY</h6>
                    <div class="row g-2">
                        <div class="col-md-4"><label class="small text-muted">SPV MODULE (MFG DEFECT)</label><input type="text" class="form-control form-control-sm" id="warrSpvDefect" value="12 YEAR"></div>
                        <div class="col-md-4"><label class="small text-muted">SPV MODULE (PERFORMANCE)</label><input type="text" class="form-control form-control-sm" id="warrSpvPerformance" value="30 YEAR PERFORMANCE"></div>
                        <div class="col-md-4"><label class="small text-muted">INVERTER (MFG DEFECT)</label><input type="text" class="form-control form-control-sm" id="warrInverterDefect" value="10 YEAR"></div>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Save changes</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Include the footer fragment -->
            <div th:replace="fragments/footer :: footerPart"></div>

        </div>
    </div>

    <!-- Shared loader overlay -->
    <div th:replace="~{fragments/commonUI :: loader}"></div>

    <!-- Shared toast notification -->
    <div th:replace="~{fragments/commonUI :: toaster}"></div>

    <!-- jQuery + Bootstrap JS + commonJS.js (showLoader / hideLoader / showToast) -->
    <div th:replace="~{fragments/commonJquery :: commonJquery}"></div>

    <!-- Quotation-specific logic (must come after commonJS.js) -->
	<script th:src="@{/js/quotation.js}"></script>
</body>
</html>
